[project]
name = "jev-ultrafast"
version = "0.1.0"
description = "An inspectable browser agent with local KaLM decisions and guarded execution."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["browser-harness==0.1.13", "httpx[http2]>=0.28,<1"]

[project.urls]
Repository = "https://github.com/rcrandon/jev-ultrafast"
Issues = "https://github.com/rcrandon/jev-ultrafast/issues"
Documentation = "https://github.com/rcrandon/jev-ultrafast/blob/main/docs/setup.md"
Upstream = "https://github.com/browser-use/jev-ultrafast"

[project.scripts]
jev = "jev_ultrafast.demo:main"
jev-doctor = "jev_ultrafast.doctor:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8.4,<9", "ruff>=0.14,<1", "pillow>=11,<13"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
